<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>DF OFFLINE TOUCH</title><style>*{box-sizing:border-box;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112b37;color:#fff;font:16px monospace}main{height:100%;padding:12px;border:8px solid #42d9b2}h3{margin:4px}pre{font-size:16px;pointer-events:none;white-space:pre-wrap}aside{position:absolute;bottom:12%;left:10%;right:10%;height:35%;border:3px dashed #79b4ce;text-align:center;padding-top:40px;pointer-events:none}</style><main id="pad"><h3>DF OFFLINE TOUCH / V2 NO SIDE EFFECT</h3><pre id="stats"></pre><aside>SAFE TOUCH ZONE<br>NO BUTTONS / NO NETWORK</aside></main><script>function TouchObserver(){this.active={};this.down=0;this.move=0;this.up=0;this.cancel=0;this.maxActive=0;this.history=[];this.visible=true;}
TouchObserver.prototype.activeCount=function(){return Object.keys(this.active).length;};
TouchObserver.prototype.event=function(type,id,x,y){if(['down','move','up','cancel'].indexOf(type)<0)throw new Error('UNKNOWN_EVENT');this[type]++;if(type==='down')this.active[id]={x:x,y:y};else if(type==='move'&&this.active[id])this.active[id]={x:x,y:y};else if(type==='up'||type==='cancel')delete this.active[id];this.maxActive=Math.max(this.maxActive,this.activeCount());this.history.push(type+' #'+id+' '+Math.round(x)+','+Math.round(y));if(this.history.length>12)this.history.shift();};
TouchObserver.prototype.visibility=function(visible){this.visible=visible;};

TouchObserver.prototype.touch=function(type,count){this.nativeTouches=count;if(type==='touchstart')this.touchStart=(this.touchStart||0)+1;if(type==='touchend')this.touchEnd=(this.touchEnd||0)+1;if(type==='touchcancel')this.touchCancel=(this.touchCancel||0)+1;};

var state=new TouchObserver(),out=document.getElementById('stats');function render(){out.textContent='ACTIVE '+state.activeCount()+'  MAX '+state.maxActive+'\nDOWN '+state.down+' MOVE '+state.move+'\nUP '+state.up+' CANCEL '+state.cancel+'\nTOUCHES '+(state.nativeTouches==null?'?':state.nativeTouches)+' TE '+(state.touchEnd||0)+' TC '+(state.touchCancel||0)+'\nVIEW '+innerWidth+'x'+innerHeight+' VISIBLE '+state.visible+'\nCLOCK '+new Date().toLocaleTimeString()+'\n'+state.history.join('\n');}['down','move','up','cancel'].forEach(function(t){document.addEventListener('pointer'+t,function(e){e.preventDefault();state.event(t,e.pointerId,e.clientX,e.clientY);render();},{passive:false});});['touchstart','touchmove','touchend','touchcancel'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();state.touch(t,e.touches.length);render();},{passive:false});});document.addEventListener('contextmenu',function(e){e.preventDefault();});document.addEventListener('visibilitychange',function(){state.visibility(!document.hidden);render();});setInterval(render,500);render();</script>
